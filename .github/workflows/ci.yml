name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: point-frontend/package-lock.json

      # freeway 1.3.8-SNAPSHOT is published to the Sonatype snapshots repo
      - name: Configure Maven (freeway snapshots)
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <profiles>
              <profile>
                <id>freeway-snapshots</id>
                <repositories>
                  <repository>
                    <id>sonatype-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots</url>
                    <snapshots><enabled>true</enabled><updatePolicy>always</updatePolicy></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>freeway-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          XML

      - name: Build backend (compile + tests + jar)
        run: mvn -B package -pl point-boot -am

      - name: Build frontend (vue-tsc + vite)
        working-directory: point-frontend
        run: |
          npm ci --registry=https://registry.npmjs.org
          npm run build

      - name: Lint frontend
        working-directory: point-frontend
        run: npm run lint

      - name: Smoke test (boot jar + API sweep)
        run: |
          java -jar point-boot/target/point-boot-1.0.0-SNAPSHOT.jar > /tmp/point.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8082/healthz > /dev/null && break
            sleep 1
          done
          bash tools/smoke-api.sh http://localhost:8082
        env:
          JAVA_HOME: ${{ steps.setup.outputs.java-home }}
