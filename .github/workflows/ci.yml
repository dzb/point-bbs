name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: point-frontend/package-lock.json

      # freeway 1.3.8 is a release on Maven Central — no extra repos needed

      - name: Build backend (compile + tests + jar)
        run: mvn -B package -pl point-boot -am

      - name: Build frontend (vue-tsc + vite)
        working-directory: point-frontend
        run: |
          npm ci --registry=https://registry.npmjs.org
          npm run build

      - name: Lint frontend
        working-directory: point-frontend
        run: npm run lint

      - name: Smoke test (boot jar + API sweep)
        run: |
          java -jar point-boot/target/point-boot-1.0.0-SNAPSHOT.jar > /tmp/point.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8082/healthz > /dev/null && break
            sleep 1
          done
          bash tools/smoke-api.sh http://localhost:8082
        env:
          JAVA_HOME: ${{ steps.setup.outputs.java-home }}
