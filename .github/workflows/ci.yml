name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: point-frontend/package-lock.json

      - name: Build backend (compile + tests + jar)
        run: mvn -B package -pl point-boot -am

      - name: Build frontend (vue-tsc + vite)
        working-directory: point-frontend
        run: |
          npm ci --registry=https://registry.npmjs.org
          npm run build

      - name: Lint frontend
        working-directory: point-frontend
        run: npm run lint

      - name: Smoke test (boot jar + API sweep)
        run: |
          JAR="$(ls -t point-boot/target/point-boot-*.jar | head -n 1)"
          echo "starting $JAR"
          # smoke-api.sh signs in as the dev seed account (moke/123456) and
          # asserts the seeded admin, so the runner needs the dev profile:
          # without it the database stays empty by design.
          java -jar "$JAR" --F2.profile=dev > /tmp/point.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8082/healthz > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8082/healthz > /dev/null || { tail -n 50 /tmp/point.log; exit 1; }
          bash tools/smoke-api.sh http://localhost:8082

      # Diagnostics only — never a retry. A failure here means startup or the
      # seed ordering regressed, and the server log says which.
      - name: Server log on smoke failure
        if: failure()
        run: tail -n 200 /tmp/point.log
